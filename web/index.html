<!doctype html>
<html lang="pt-BR">
  <head>
    <!--
    Se o aplicativo web for hospedado em um caminho diferente da raiz, altere o
    valor de href abaixo para corresponder ao caminho base da hospedagem.

    O caminho informado abaixo deve começar e terminar com uma barra "/" para
    funcionar corretamente.

    Para saber mais:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    Este marcador de href base será substituído pelo valor do argumento
    `--base-href` informado ao comando `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="Organize suas tarefas por dia com o Meu Planner. Suas tarefas, no seu ritmo." />
    <meta name="theme-color" content="#0821AF" />

    <!-- Metadados e ícones para iOS -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Meu Planner" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Ícone da aba do navegador -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>Meu Planner</title>
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <!--
    Você pode personalizar o script "flutter_bootstrap.js".
    Isso permite configurar o carregador do Flutter
    ou informar ao usuário o andamento da inicialização.

    Para saber mais:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
