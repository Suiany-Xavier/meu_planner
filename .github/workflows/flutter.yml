name: Verificações Flutter

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@v6
      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Instalar dependências do arquivo de lock
        run: flutter pub get --enforce-lockfile
      - name: Analisar código
        run: flutter analyze --no-pub
      - name: Executar testes com cobertura
        run: flutter test --no-pub --coverage
