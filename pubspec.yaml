name: meu_planner
description: "Organize suas tarefas por dia com o Meu Planner. Suas tarefas, no seu ritmo."
# Aplicativo, não pacote: impede publicação acidental no pub.dev.
publish_to: "none"

# versão+build. No Android: versionName+versionCode; no iOS: CFBundleShortVersionString+CFBundleVersion.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
